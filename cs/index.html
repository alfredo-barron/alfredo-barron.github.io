<title>Metaheurísticas en movimiento</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Concepto: cuaderno de laboratorio nocturno. Cada diapositiva es una mesa de trabajo:
   a la izquierda la teoría, a la derecha el algoritmo corriendo sobre el mapa de la función. */
:root{
  --bg:#0b1026; --panel:#121a3a; --panel2:#18224a; --line:#2a3768; --fg:#eef0ff; --mute:#9aa6d6;
  --gold:#ffc94d; --cyan:#62e6ff; --coral:#ff6b6b; --lime:#b6f36a; --mag:#ff5fd2; --vio:#b49cff;
  --display:"Bricolage Grotesque", "Space Grotesk", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(11,16,38,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .brand{font-family:var(--display);font-weight:800;letter-spacing:.01em}
.bar .brand small{font-family:var(--mono);font-weight:400;color:var(--mute);margin-left:8px;font-size:12px}
.bar .sp{flex:1}
.bar select{max-width:min(320px,52vw)}
.count{font-family:var(--mono);color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
button,select,input[type=number]{font:500 14px var(--body);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.pri{background:var(--gold);color:#1b1500;border-color:var(--gold);font-weight:600}
button.pri:hover{filter:brightness(1.08)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;max-width:1380px;margin:0 auto}
[hidden]{display:none!important}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.08;text-wrap:balance;margin:.2em 0 .35em}
h1{font-size:clamp(34px,6vw,68px)}
h2{font-size:clamp(26px,3.4vw,40px)}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:1.1em 0 .4em}
p{margin:.4em 0}
.who{font-family:var(--mono);font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.theory{min-width:0}
.eqs{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.eq{font-family:var(--mono);font-size:14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:7px 10px;overflow-x:auto}
ul.read{padding-left:18px;margin:.3em 0;color:#d6dbf7}
ul.read li{margin:.2em 0}
.ctrls{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 16px;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.ctrl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);gap:8px}
.ctrl label b{font-family:var(--mono);color:var(--fg);font-weight:600}
input[type=range]{width:100%;accent-color:var(--gold)}
.demo{min-width:0;display:flex;flex-direction:column;gap:10px}
.cvwrap{position:relative;width:100%;max-width:min(100%,74vh);margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0b1026}
.cvwrap canvas{display:block;width:100%;aspect-ratio:1/1;cursor:crosshair}
.cvwrap.wide canvas{aspect-ratio:16/10}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns .speed{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin-left:auto}
.btns .speed input{width:110px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg)} .stats .fin{color:var(--lime)}
.info{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:120px;overflow-x:auto;font-size:14px}
.info .op{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-family:var(--mono);font-size:13.5px;margin-bottom:4px}
.info .op span{font-family:var(--display);font-weight:600;font-size:15px;color:var(--gold)}
.info code,.theory code{font-family:var(--mono);background:var(--panel2);padding:1px 5px;border-radius:4px}
.info .ok{color:var(--lime)} .info .warn{color:var(--coral)}
table.mini{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:6px 0;font-variant-numeric:tabular-nums}
table.mini th,table.mini td{border-bottom:1px solid var(--line);padding:3px 8px;text-align:right;white-space:nowrap}
table.mini th{color:var(--mute);font-weight:400}
table.mini tr.hl td{color:var(--gold);font-weight:600}
.bits{font-family:var(--mono);letter-spacing:.06em}
.pa{color:var(--gold)} .pb{color:var(--cyan)} .mu{color:var(--mag);text-decoration:underline;font-weight:600}
.perm{display:inline-flex;gap:2px;flex-wrap:wrap;vertical-align:middle}
.perm i{font-style:normal;font-family:var(--mono);font-size:12px;min-width:22px;text-align:center;padding:2px 3px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.perm i.a{background:rgba(255,201,77,.22);border-color:var(--gold)} .perm i.b{background:rgba(98,230,255,.16);border-color:var(--cyan)}
.perm i.x{text-decoration:line-through;opacity:.45} .perm i.m{background:rgba(255,95,210,.25);border-color:var(--mag)}
.hint{font-size:12.5px;color:var(--mute)}
/* portada e índice */
.cover{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:32px;align-items:center;min-height:60vh}
@media (max-width:980px){.cover{grid-template-columns:minmax(0,1fr)}}
.cover .lead{font-size:18px;color:#d6dbf7;max-width:58ch}
.cover canvas{width:100%;aspect-ratio:1/1;border-radius:14px;border:1px solid var(--line);display:block}
.meta{font-family:var(--mono);font-size:13px;color:var(--mute);margin-top:18px;display:grid;gap:2px}
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:14px}
.idx .grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.idx .grp h3{margin:0 0 8px;font-size:16px}
.idx a{display:flex;justify-content:space-between;gap:8px;color:var(--fg);text-decoration:none;padding:5px 0;border-bottom:1px dashed var(--line)}
.idx a:hover{color:var(--gold)}
.idx a span{font-family:var(--mono);font-size:12px;color:var(--mute)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.legend div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.ramp{height:14px;border-radius:7px;background:linear-gradient(90deg,#fafad6,#cef08c,#54c8a0,#2c789e,#1e3468,#0d132e);margin:8px 0 4px}
.ramp+.rl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--mute)}
table.big{border-collapse:collapse;width:100%;font-size:14px}
table.big th,table.big td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.big th{font-family:var(--mono);font-size:12px;color:var(--mute);font-weight:400;text-transform:uppercase;letter-spacing:.06em}
.tw{overflow-x:auto}
.cmpc{width:100%;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:5px;font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.navfoot{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<script>
/* ============================================================
   Motor de optimización · Cómputo Suave U3 · núcleo
   Funciones de prueba, mapa de calor, escena y ejecutor paso a paso
   ============================================================ */
const TAU = Math.PI * 2;
const C = {
  gold: '#ffc94d', coral: '#ff6b6b', mag: '#ff5fd2', cyan: '#62e6ff', lime: '#b6f36a',
  vio: '#b49cff', w: '#f5f3ff', ink: '#0b1026', mute: 'rgba(245,243,255,.5)', faint: 'rgba(245,243,255,.2)'
};
const HUES = ['#ffc94d', '#62e6ff', '#ff6b6b', '#b6f36a', '#ff5fd2', '#b49cff', '#ff9f43', '#4dd4ac',
  '#f78fb3', '#70a1ff', '#eccc68', '#7bed9f', '#e17055', '#81ecec', '#fd79a8', '#a29bfe'];

/* ---------- aleatorios con semilla ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
class Rng {
  constructor(seed) { this.r = mulberry32(seed >>> 0); this.spare = null; }
  u(a = 0, b = 1) { return a + (b - a) * this.r(); }
  int(n) { return Math.floor(this.r() * n); }
  n() {
    if (this.spare !== null) { const v = this.spare; this.spare = null; return v; }
    let u = 0; while (u === 0) u = this.r();
    const v = this.r(), m = Math.sqrt(-2 * Math.log(u));
    this.spare = m * Math.sin(TAU * v); return m * Math.cos(TAU * v);
  }
  distinct(n, k, excl = []) {
    const out = []; let guard = 0;
    while (out.length < k && guard++ < 1000) { const v = this.int(n); if (!out.includes(v) && !excl.includes(v)) out.push(v); }
    return out;
  }
  perm(n) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = this.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
}

/* ---------- formato ---------- */
const SUPS = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function fm(v, d = 3) {
  if (v === undefined || v === null || Number.isNaN(v)) return '—';
  if (!isFinite(v)) return v > 0 ? '∞' : '−∞';
  const a = Math.abs(v);
  if (a !== 0 && (a < 1e-3 || a >= 1e5)) {
    const [m, e] = v.toExponential(2).split('e');
    return m.replace('-', '−') + '×10' + String(+e).split('').map(ch => SUPS[ch] || ch).join('');
  }
  let s = (+v.toFixed(d)).toString();
  return s.replace('-', '−');
}
const pv = (p, d = 3) => `(${fm(p[0], d)}, ${fm(p[1], d)})`;
const sb = k => `<sub>${k}</sub>`;

/* ---------- vectores ---------- */
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const mul = (a, s) => [a[0] * s, a[1] * s];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

/* ---------- funciones de prueba 2D ---------- */
const FUNCS = {
  esfera: {
    nombre: 'Esfera', f: (x, y) => x * x + y * y, dom: [-5.12, 5.12, -5.12, 5.12], opt: [[0, 0]], fopt: 0,
    formula: 'f(x, y) = x² + y²', eta: 0.1, start: [-4, 3.5], tipo: 'Unimodal y convexa',
    nota: 'Un solo mínimo y curvas de nivel circulares. Cualquier método local llega al óptimo.'
  },
  booth: {
    nombre: 'Booth', f: (x, y) => (x + 2 * y - 7) ** 2 + (2 * x + y - 5) ** 2, dom: [-5, 5, -5, 5], opt: [[1, 3]], fopt: 0,
    formula: 'f(x, y) = (x + 2y − 7)² + (2x + y − 5)²', eta: 0.05, start: [-4, -4], tipo: 'Cuadrática, valle inclinado',
    nota: 'Curvas de nivel elípticas e inclinadas: el gradiente avanza en zigzag si la tasa es grande.'
  },
  rosenbrock: {
    nombre: 'Rosenbrock', f: (x, y) => 100 * (y - x * x) ** 2 + (1 - x) ** 2, dom: [-2, 2, -1, 3], opt: [[1, 1]], fopt: 0,
    formula: 'f(x, y) = 100(y − x²)² + (1 − x)²', eta: 0.001, start: [-1.2, 1], tipo: 'Valle curvo y angosto',
    nota: 'Encontrar el valle es fácil; recorrerlo hasta (1, 1) es difícil. Es la función de la práctica de AG.'
  },
  himmelblau: {
    nombre: 'Himmelblau', f: (x, y) => (x * x + y - 11) ** 2 + (x + y * y - 7) ** 2, dom: [-5, 5, -5, 5],
    opt: [[3, 2], [-2.805118, 3.131312], [-3.77931, -3.283186], [3.584428, -1.848126]], fopt: 0,
    formula: 'f(x, y) = (x² + y − 11)² + (x + y² − 7)²', eta: 0.01, start: [-0.3, -0.6], tipo: 'Cuatro mínimos globales',
    nota: 'Los cuatro mínimos valen 0. El punto inicial decide a cuál llega un método local.'
  },
  rastrigin: {
    nombre: 'Rastrigin', f: (x, y) => 20 + x * x - 10 * Math.cos(TAU * x) + y * y - 10 * Math.cos(TAU * y),
    dom: [-5.12, 5.12, -5.12, 5.12], opt: [[0, 0]], fopt: 0,
    formula: 'f(x, y) = 20 + Σ (xᵢ² − 10 cos 2πxᵢ)', eta: 0.002, start: [3.2, -2.7], tipo: 'Multimodal, mínimos en cuadrícula',
    nota: 'Cerca de 100 mínimos locales en el dominio. Un método local se queda en el más cercano.'
  },
  ackley: {
    nombre: 'Ackley',
    f: (x, y) => -20 * Math.exp(-0.2 * Math.sqrt((x * x + y * y) / 2)) - Math.exp((Math.cos(TAU * x) + Math.cos(TAU * y)) / 2) + 20 + Math.E,
    dom: [-5, 5, -5, 5], opt: [[0, 0]], fopt: 0,
    formula: 'f = −20e^(−0.2√(Σxᵢ²/n)) − e^(Σcos 2πxᵢ/n) + 20 + e', eta: 0.05, start: [3, -2.5], tipo: 'Casi plana con un embudo',
    nota: 'Lejos del centro es casi plana y llena de pequeños hoyos; el óptimo está en un embudo angosto.'
  },
  griewank: {
    nombre: 'Griewank', f: (x, y) => 1 + (x * x + y * y) / 4000 - Math.cos(x) * Math.cos(y / Math.SQRT2),
    dom: [-10, 10, -10, 10], opt: [[0, 0]], fopt: 0,
    formula: 'f = 1 + Σxᵢ²/4000 − Π cos(xᵢ/√i)', eta: 1, start: [8, -7], tipo: 'Multimodal suave',
    nota: 'Una parábola muy plana con ondas encima: los mínimos locales tienen valores muy parecidos.'
  },
  easom: {
    nombre: 'Easom', f: (x, y) => -Math.cos(x) * Math.cos(y) * Math.exp(-((x - Math.PI) ** 2 + (y - Math.PI) ** 2)),
    dom: [-1, 7, -1, 7], opt: [[Math.PI, Math.PI]], fopt: -1,
    formula: 'f = −cos x cos y e^(−(x−π)² − (y−π)²)', eta: 0.5, start: [0.5, 5.5], tipo: 'Meseta con un hoyo',
    nota: 'Casi todo el dominio vale 0: el gradiente no da información hasta caer cerca del hoyo.'
  },
  schwefel: {
    nombre: 'Schwefel', f: (x, y) => 837.9658 - x * Math.sin(Math.sqrt(Math.abs(x))) - y * Math.sin(Math.sqrt(Math.abs(y))),
    dom: [-500, 500, -500, 500], opt: [[420.9687, 420.9687]], fopt: 0,
    formula: 'f = 418.98n − Σ xᵢ sen √|xᵢ|', eta: 10, start: [-300, 200], tipo: 'Engañosa',
    nota: 'El segundo mejor mínimo está lejos del óptimo, en la esquina opuesta. Engaña a muchos métodos.'
  }
};
for (const [k, F] of Object.entries(FUNCS)) F.id = k;

/* ---------- funciones 1D ---------- */
const F1D = {
  expo: { id: 'expo', nombre: 'e^x − 2x', f: x => Math.exp(x) - 2 * x, a: -1, b: 2.2, opt: Math.LN2, start: 0 },
  cuartica: { id: 'cuartica', nombre: 'x⁴ − 3x² + x', f: x => x ** 4 - 3 * x * x + x, a: -2.1, b: 2.1, opt: -1.30084, start: 0.6 },
  ondas: { id: 'ondas', nombre: 'x·sen(10πx) + 1', f: x => x * Math.sin(10 * Math.PI * x) + 1, a: -1, b: 2, opt: 1.85055, max: true }
};

function grad(F, p) {
  const h = 1e-6 * Math.max(1, Math.abs(p[0]), Math.abs(p[1]));
  return [(F.f(p[0] + h, p[1]) - F.f(p[0] - h, p[1])) / (2 * h), (F.f(p[0], p[1] + h) - F.f(p[0], p[1] - h)) / (2 * h)];
}
const rng2 = F => Math.max(F.dom[1] - F.dom[0], F.dom[3] - F.dom[2]);
const inDom = (F, p) => p[0] >= F.dom[0] && p[0] <= F.dom[1] && p[1] >= F.dom[2] && p[1] <= F.dom[3];
const clampP = (F, p) => [Math.min(F.dom[1], Math.max(F.dom[0], p[0])), Math.min(F.dom[3], Math.max(F.dom[2], p[1]))];
const randIn = (F, R) => [R.u(F.dom[0], F.dom[1]), R.u(F.dom[2], F.dom[3])];

/* ---------- mapa de calor con curvas de nivel ---------- */
const STOPS = [[0, [250, 250, 214]], [0.1, [206, 240, 140]], [0.28, [84, 200, 160]], [0.5, [44, 120, 158]], [0.75, [30, 52, 104]], [1, [13, 19, 46]]];
function cmap(q) {
  for (let i = 1; i < STOPS.length; i++) {
    if (q <= STOPS[i][0]) {
      const [q0, c0] = STOPS[i - 1], [q1, c1] = STOPS[i], t = (q - q0) / (q1 - q0);
      return [c0[0] + (c1[0] - c0[0]) * t, c0[1] + (c1[1] - c0[1]) * t, c0[2] + (c1[2] - c0[2]) * t];
    }
  }
  return STOPS[STOPS.length - 1][1];
}
const fieldCache = new Map();
function fieldCanvas(F, w, h) {
  const key = F.id + ':' + w + 'x' + h;
  if (fieldCache.has(key)) return fieldCache.get(key);
  const [x0, x1, y0, y1] = F.dom, vals = new Float64Array(w * h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    vals[j * w + i] = F.f(x0 + (i + 0.5) / w * (x1 - x0), y1 - (j + 0.5) / h * (y1 - y0));
  }
  const step = Math.max(1, Math.floor(vals.length / 5000)), samp = [];
  for (let i = 0; i < vals.length; i += step) samp.push(vals[i]);
  samp.sort((a, b) => a - b);
  const q = v => { let lo = 0, hi = samp.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (samp[m] <= v) lo = m; else hi = m - 1; } return lo / (samp.length - 1); };
  const NB = 14, band = new Uint8Array(w * h), qq = new Float32Array(w * h);
  for (let i = 0; i < vals.length; i++) { qq[i] = q(vals[i]); band[i] = Math.min(NB - 1, Math.floor(qq[i] * NB)); }
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'), img = cx.createImageData(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const k = j * w + i; let [r, g, b] = cmap(Math.pow(qq[k], 0.9));

/* ---------- ejecutor paso a paso ---------- */
class Runner {
  constructor({ plot, info, stats }) { this.plot = plot; this.info = info; this.stats = stats; this.timer = null; this.speed = 4; this.onState = null; }
  load(def, F, P, seed = 7) {
    this.stopPlay(); this.def = def; this.F = F; this.evals = 0; this.S = {}; this.R = new Rng(seed);
    const self = this;
    const ev = def.kind === '1d' ? (x => { self.evals++; return F.f(x); }) : (def.kind === 'tsp' ? (r => { self.evals++; return r; }) : ((x, y) => { self.evals++; return F.f(x, y); }));
    if (def.kind === '2d') this.plot.set2D(F); else if (def.kind === '1d') this.plot.set1D(F); else this.plot.setPlain([0, 1, 0, 1]);
    this.gen = def.gen(F, P, this.R, this.S, ev); this.done = false; this.cur = { info: '' };
    this.adv(); this.render();
  }
  adv() {
    if (this.done) return false;
    let r; try { r = this.gen.next(); } catch (e) { console.error(e); this.done = true; return false; }
    if (r.done) { this.done = true; return false; }
    this.cur = r.value; if (this.cur.stop) this.done = true; return true;
  }
  step() { this.adv(); this.render(); }
  iterate() { let n = 0; while (n++ < 4000) { if (!this.adv()) break; if (this.cur.end) break; } this.render(); }
  play() {
    if (this.timer) { this.stopPlay(); return; }
    const tick = () => { this.iterate(); if (this.done) { this.stopPlay(); return; } this.timer = setTimeout(tick, 1000 / this.speed); };
    this.timer = setTimeout(tick, 10); this.onState && this.onState(true);
  }
  stopPlay() { if (this.timer) clearTimeout(this.timer); this.timer = null; this.onState && this.onState(false); }
  render() {
    this.plot.draw(this.S);
    if (this.info) this.info.innerHTML = this.cur.info || '';
    if (this.stats) {
      const S = this.S, b = S.best;
      const lab = this.def.kind === 'tsp' ? 'Mejor longitud' : (this.F.max ? 'Mejor f (máx.)' : 'Mejor f');
      const where = b && b.p && this.def.kind !== 'tsp' ? (this.def.kind === '1d' ? ` en x = ${fm(b.p, 4)}` : ` en ${pv(b.p, 3)}`) : '';
      this.stats.innerHTML = `<span>${S.iterLabel || 'Iteración'} <b>${S.iter ?? 0}</b></span><span>Evaluaciones <b>${this.evals}</b></span>` +
        (b ? `<span>${lab} <b>${fm(b.f, 4)}</b>${where}</span>` : '') + (S.extra ? `<span>${S.extra}</span>` : '') + (this.done ? '<span class="fin">terminó</span>' : '');
    }
  }
}

/* Corre un algoritmo sin dibujar hasta agotar el presupuesto; devuelve la traza (evaluaciones, mejor f) */
function runBudget(def, F, P, seed, budget) {
  let evals = 0; const S = {}, R = new Rng(seed), ev = (x, y) => { evals++; return F.f(x, y); };
  const g = def.gen(F, P, R, S, ev), trace = []; let guard = 0;
  while (evals < budget && guard++ < 200000) {
    const r = g.next(); if (r.done) break;
    if (S.best) trace.push([evals, S.best.f]);
    if (r.value && r.value.stop) break;
  }
  return trace;
}

/* ============================================================
   Algoritmos de la Unidad 3 como generadores paso a paso.
   Cada yield deja la escena S lista para dibujar y devuelve
   { info: html de la operación, end: fin de iteración, stop: terminó }
   ============================================================ */
const ALG = {};
const mono = s => `<code>${s}</code>`;
const op = (n, t) => `<div class="op"><span>${n}</span>${t}</div>`;
const setBest = (S, p, f, max = false) => { if (!S.best || (max ? f > S.best.f : f < S.best.f)) S.best = { p: Array.isArray(p) ? p.slice() : p, f }; };

/* ---------------- 1. Descenso de gradiente ---------------- */
ALG.gradiente = {
  nombre: 'Descenso de gradiente', kind: '2d', click: true,
  funcs: ['booth', 'esfera', 'rosenbrock', 'himmelblau', 'rastrigin', 'ackley'],
  params: F => [{ k: 'eta', l: 'η (tasa de aprendizaje)', min: F.eta / 10, max: F.eta * 4, step: F.eta / 20, v: F.eta }],
  *gen(F, P, R, S, ev) {
    let x = (P.start || F.start).slice(), f = ev(...x); const path = [x.slice()], hist = [f];
    S.iter = 0; setBest(S, x, f);
    S.paths = [{ p: path, c: C.gold, w: 2.2, dots: true }]; S.pts = [{ p: x, c: C.w, r: 6, label: 'x₀' }]; S.spark = { data: hist, label: 'f(xₖ)' };
    yield { info: op('Inicio', `x${sb(0)} = ${pv(x)}, f(x${sb(0)}) = ${fm(f)}`) + `<p>Regla: ${mono('x<sub>k+1</sub> = x<sub>k</sub> − η ∇f(x<sub>k</sub>)')}. Haz clic en el mapa para cambiar el punto inicial.</p>`, end: true };
    for (let k = 0; k < 3000; k++) {
      const g = grad(F, x), gn = Math.hypot(...g), nx = [x[0] - P.eta * g[0], x[1] - P.eta * g[1]];
      const vis = dist(nx, x) > 0.25 * rng2(F) ? add(x, mul(sub(nx, x), 0.25 * rng2(F) / dist(nx, x))) : nx;
      S.segs = [{ a: x, b: vis, c: C.coral, w: 2.6, head: true, label: '−η∇f' }];
      yield { info: op('1 · Gradiente', `∇f(x${sb(k)}) = ${pv(g)} &nbsp; ‖∇f‖ = ${fm(gn)}`) + `<p>La flecha roja es −η∇f: la dirección de mayor descenso, escalada por η = ${fm(P.eta, 4)}.</p>` };
      const old = x; x = nx; f = ev(...x); path.push(x.slice()); hist.push(f); S.iter = k + 1; setBest(S, x, f);
      S.segs = []; S.pts = [{ p: x, c: C.w, r: 6, label: 'x' + (k + 1 < 10 ? '₀₁₂₃₄₅₆₇₈₉'[k + 1] : '') }];
      const info = op('2 · Paso', `x${sb(k + 1)} = ${pv(old)} − ${fm(P.eta, 4)}·${pv(g)} = <b>${pv(x)}</b>`) + `<p>f(x${sb(k + 1)}) = ${fm(f)} ${f < hist[hist.length - 2] ? '↓ bajó' : '↑ subió: η es demasiado grande'}</p>`;
      if (!inDom({ dom: F.dom.map((v, i) => v + (i % 2 ? 1 : -1) * rng2(F)) }, x) || !isFinite(f)) { yield { info: info + '<p class="warn">Divergió: el punto salió del dominio. Reduce η.</p>', end: true, stop: true }; return; }
      if (gn < 1e-5) { yield { info: info + '<p class="ok">Convergió: ‖∇f‖ ≈ 0 (punto crítico).</p>', end: true, stop: true }; return; }
      yield { info, end: true };
    }
  }
};

/* ---------------- 2. Newton en una variable ---------------- */
ALG.newton = {
  nombre: 'Método de Newton', kind: '1d', click: true, funcs1d: ['expo', 'cuartica'],
  params: () => [{ k: 'eta', l: 'η del gradiente (comparación)', min: 0.05, max: 1, step: 0.05, v: 0.5 }],
  *gen(G, P, R, S, ev) {
    const d1 = x => (G.f(x + 1e-5) - G.f(x - 1e-5)) / 2e-5, d2 = x => (G.f(x + 1e-4) - 2 * G.f(x) + G.f(x - 1e-4)) / 1e-8;
    let x = P.start ?? G.start, xg = x; const rows = [[0, x, xg]];
    ev(x); S.iter = 0; setBest(S, x, G.f(x));
    const tabla = () => `<table class="mini"><tr><th>k</th><th>x Newton</th><th>error</th><th>x gradiente</th><th>error</th></tr>` +
      rows.map(r => `<tr><td>${r[0]}</td><td>${fm(r[1], 4)}</td><td>${fm(Math.abs(r[1] - G.opt), 4)}</td><td>${fm(r[2], 4)}</td><td>${fm(Math.abs(r[2] - G.opt), 4)}</td></tr>`).join('') + '</table>';
    const scene = (extra = []) => {
      S.pts = [{ p: [x, G.f(x)], c: C.gold, r: 6, label: 'Newton' }, { p: [xg, G.f(xg)], c: C.cyan, r: 5, label: 'gradiente', lc: C.cyan }, ...extra];
    };
    scene(); S.paths = [];
    yield { info: op('Inicio', `x${sb(0)} = ${fm(x, 4)}`) + `<p>Newton: ${mono('x<sub>k+1</sub> = x<sub>k</sub> − f′(x<sub>k</sub>)/f″(x<sub>k</sub>)')}. En dorado Newton, en cian el gradiente con η = ${P.eta}. Clic en la gráfica para mover x₀.</p>` + tabla(), end: true };
    for (let k = 0; k < 40; k++) {
      const a = d1(x), b = d2(x), fx = G.f(x); ev(x);
      const q = t => fx + a * (t - x) + 0.5 * b * (t - x) ** 2, span = (G.b - G.a) * 0.35, pts = [];
      for (let i = 0; i <= 60; i++) { const t = x - span + 2 * span * i / 60; pts.push([t, q(t)]); }
      S.paths = [{ p: pts, c: C.mag, w: 2, dash: true }];
      const nx = x - a / b;
      scene(b > 0 ? [{ p: [nx, q(nx)], c: C.mag, r: 4, label: 'mín. del modelo', lc: C.mag }] : []);
      yield { info: op('1 · Modelo cuadrático', `f′(x${sb(k)}) = ${fm(a, 4)}, f″(x${sb(k)}) = ${fm(b, 4)}`) +
        `<p>La parábola rosa es ${mono('q(x) = f(x<sub>k</sub>) + f′·(x − x<sub>k</sub>) + ½f″·(x − x<sub>k</sub>)²')}. Newton salta a su vértice.${b < 0 ? ' <span class="warn">f″ &lt; 0: la parábola abre hacia abajo y Newton se va hacia un máximo.</span>' : ''}</p>` + tabla() };
      const ox = x; x = nx; xg = xg - P.eta * d1(xg); ev(x); ev(xg); rows.push([k + 1, x, xg]); S.iter = k + 1; setBest(S, x, G.f(x));
      S.paths = []; scene([{ p: [ox, G.f(ox)], c: C.faint, r: 3 }]);
      const info = op('2 · Salto', `x${sb(k + 1)} = ${fm(ox, 4)} − ${fm(a, 4)}/${fm(b, 4)} = <b>${fm(x, 4)}</b>`) + tabla();
      if (Math.abs(a) < 1e-9 || Math.abs(x - ox) < 1e-10) { yield { info: info + '<p class="ok">Convergió: el error se eleva casi al cuadrado en cada paso (convergencia cuadrática).</p>', end: true, stop: true }; return; }
      yield { info, end: true };
    }
  }
};

/* ---------------- 3. BFGS ---------------- */
ALG.bfgs = {
  nombre: 'BFGS (cuasi-Newton)', kind: '2d', click: true, funcs: ['rosenbrock', 'booth', 'himmelblau', 'esfera', 'rastrigin'],
  params: () => [],
  *gen(F, P, R, S, ev) {
    let x = (P.start || F.start).slice(), f = ev(...x), g = grad(F, x), H = [[1, 0], [0, 1]];
    let xg = x.slice(); const path = [x.slice()], gpath = [xg.slice()], hist = [f], ghist = [f];
    S.iter = 0; setBest(S, x, f);
    S.paths = [{ p: gpath, c: C.cyan, w: 1.6, al: 0.8 }, { p: path, c: C.gold, w: 2.4, dots: true }];
    S.pts = [{ p: x, c: C.w, r: 6 }]; S.spark = { data: hist, data2: ghist, label: 'f: BFGS (dorado) vs gradiente (cian)' };
    const Hs = () => `H = [[${fm(H[0][0])}, ${fm(H[0][1])}], [${fm(H[1][0])}, ${fm(H[1][1])}]]`;
    yield { info: op('Inicio', `x${sb(0)} = ${pv(x)}, H${sb(0)} = I`) + '<p>BFGS aproxima la inversa de la Hessiana con los gradientes. En cian, el descenso de gradiente con η fija para comparar.</p>', end: true };
    for (let k = 0; k < 200; k++) {
      const p = [-(H[0][0] * g[0] + H[0][1] * g[1]), -(H[1][0] * g[0] + H[1][1] * g[1])], gp = g[0] * p[0] + g[1] * p[1];
      let a = 1, nx, nf, tries = 0;
      while (true) { nx = add(x, mul(p, a)); nf = ev(...nx); tries++; if (nf <= f + 1e-4 * a * gp || tries > 30) break; a *= 0.5; }
      S.segs = [{ a: x, b: nx, c: C.coral, w: 2.6, head: true, label: 'α·p' }];
      yield { info: op('1 · Dirección y búsqueda lineal', `p = −H∇f = ${pv(p)}`) + `<p>Se prueba α = 1, ½, ¼, … hasta que f baja lo suficiente (Armijo): α = <b>${fm(a, 4)}</b> tras ${tries} prueba(s).</p>` };
      const ng = grad(F, nx), s = sub(nx, x), y = sub(ng, g), ys = y[0] * s[0] + y[1] * s[1];
      if (ys > 1e-12) {
        const r = 1 / ys, A = [[1 - r * s[0] * y[0], -r * s[0] * y[1]], [-r * s[1] * y[0], 1 - r * s[1] * y[1]]];
        const AH = [[A[0][0] * H[0][0] + A[0][1] * H[1][0], A[0][0] * H[0][1] + A[0][1] * H[1][1]], [A[1][0] * H[0][0] + A[1][1] * H[1][0], A[1][0] * H[0][1] + A[1][1] * H[1][1]]];
        H = [[AH[0][0] * A[0][0] + AH[0][1] * A[0][1] + r * s[0] * s[0], AH[0][0] * A[1][0] + AH[0][1] * A[1][1] + r * s[0] * s[1]],
        [AH[1][0] * A[0][0] + AH[1][1] * A[0][1] + r * s[1] * s[0], AH[1][0] * A[1][0] + AH[1][1] * A[1][1] + r * s[1] * s[1]]];
      }
      x = nx; f = nf; g = ng; path.push(x.slice()); hist.push(f); S.iter = k + 1; setBest(S, x, f);
      const gg = grad(F, xg); xg = add(xg, mul(gg, -F.eta)); gpath.push(xg.slice()); ghist.push(F.f(...xg));
      S.segs = []; S.pts = [{ p: x, c: C.w, r: 6 }, { p: xg, c: C.cyan, r: 4 }];
      const info = op('2 · Actualizar H', `s = ${pv(s)}, y = ${pv(y)}`) + `<p>${mono(Hs())}</p><p>x${sb(k + 1)} = ${pv(x)}, f = ${fm(f)} · gradiente fijo: f = ${fm(ghist[ghist.length - 1])}</p>`;
      if (Math.hypot(...g) < 1e-6) { yield { info: info + `<p class="ok">Convergió en ${k + 1} iteraciones.</p>`, end: true, stop: true }; return; }
      yield { info, end: true };
    }
  }
};

ALG.aleatoria = {

  params: () => [{ k: 'lote', l: 'Muestras por iteración', min: 1, max: 50, step: 1, v: 10 }],
  *gen(F, P, R, S, ev) {
    const all = [], imp = []; S.iter = 0; S.pts = []; const hist = [];

    yield { info: op('Idea', 'Generar x ∼ U(S) y quedarse con el mejor') + '<p>No usa información de los puntos anteriores. Sirve como línea base para comparar.</p>', end: true };
    for (let k = 0; k < 100000; k++) {
      const x = randIn(F, R), f = ev(...x); all.push(x);
      const mejora = !S.best || f < S.best.f; setBest(S, x, f); if (mejora) imp.push(x); hist.push(S.best.f);

  *gen(F, P, R, S, ev) {

    for (let k = 0; k < 100000; k++) {
      const y = clampP(F, [x[0] + P.sigma * R.n(), x[1] + P.sigma * R.n()]), fy = ev(...y), ok = fy < f;
      S.iter = k + 1;

        `<p>${ok ? '<span class="ok">f(y) &lt; f(x): x ← y.</span>' : 'f(y) ≥ f(x): se rechaza.'} Intentos seguidos sin mejora: <b>${ok ? 0 : fails + 1}</b>.</p>`;
      if (ok) { x = y; f = fy; fails = 0; path.push(x.slice()); } else fails++;
      hist.push(f); setBest(S, x, f); S.circles = [{ p: x, R: 2 * P.sigma, c: C.mute }];
      if (fails >= 80) { yield { info: info + '<p class="warn">80 vecinos seguidos sin mejora: se quedó en un mínimo local.</p>', end: true, stop: true }; return; }

    }
  }
};

/* ---------------- 6. Nelder–Mead ---------------- */
ALG.nelder = {
  nombre: 'Nelder–Mead (símplex)', kind: '2d', click: true, funcs: ['himmelblau', 'rosenbrock', 'booth', 'rastrigin', 'ackley', 'easom'],
  params: F => [{ k: 'lado', l: 'Tamaño del símplex inicial', min: rng2(F) / 50, max: rng2(F) / 4, step: rng2(F) / 200, v: rng2(F) / 10 }],
  *gen(F, P, R, S, ev) {
    const s0 = (P.start || F.start).slice();
    let V = [s0, [s0[0] + P.lado, s0[1]], [s0[0], s0[1] + P.lado]].map(p => ({ p, f: ev(...p) }));
    const ghosts = [], hist = []; S.iter = 0;
    const draw = (extra = [], segs = []) => {
      S.paths = [...ghosts.slice(-25).map(g => ({ p: g, c: 'rgba(245,243,255,.25)', w: 1, closed: true })), { p: V.map(v => v.p), c: C.gold, w: 2.4, closed: true, fill: 'rgba(255,201,77,.15)' }];
      S.pts = [...V.map((v, i) => ({ p: v.p, c: i === 0 ? C.lime : i === 2 ? C.coral : C.w, r: 5, label: ['B mejor', 'M', 'W peor'][i] })), ...extra]; S.segs = segs;
    };
    V.sort((a, b) => a.f - b.f); setBest(S, V[0].p, V[0].f); hist.push(V[0].f); S.spark = { data: hist };
    draw();
    yield { info: op('Inicio', 'Símplex de 3 vértices') + `<p>f = ${V.map(v => fm(v.f)).join(', ')}. Coeficientes: α = 1, γ = 2, ρ = 0.5, σ = 0.5.</p>`, end: true };
    for (let k = 0; k < 2000; k++) {
      V.sort((a, b) => a.f - b.f); draw();
      yield { info: op('1 · Ordenar', `B = ${pv(V[0].p)} (f = ${fm(V[0].f)}), M = ${pv(V[1].p)} (f = ${fm(V[1].f)}), W = ${pv(V[2].p)} (f = ${fm(V[2].f)})`) };
      const c = mul(add(V[0].p, V[1].p), 0.5), xr = add(c, sub(c, V[2].p)), fr = ev(...xr);
      draw([{ p: c, c: C.cyan, r: 4, label: 'c' }, { p: xr, c: C.mag, r: 5, label: 'xr' }], [{ a: V[2].p, b: xr, c: C.mag, w: 1.6, dash: true, head: true }]);
      yield { info: op('2 · Centroide y reflexión', `c = ${pv(c)}, x${sb('r')} = c + (c − W) = ${pv(xr)}, f${sb('r')} = ${fm(fr)}`) };
      ghosts.push(V.map(v => v.p)); let msg, extra = [];
      if (fr < V[0].f) {
        const xe = add(c, mul(sub(xr, c), 2)), fe = ev(...xe); extra = [{ p: xe, c: C.lime, r: 5, label: 'xe' }];
        if (fe < fr) { V[2] = { p: xe, f: fe }; msg = `f${sb('r')} &lt; f(B): se prueba la <b>expansión</b> x${sb('e')} = ${pv(xe)}, f${sb('e')} = ${fm(fe)} &lt; f${sb('r')}: se acepta x${sb('e')}.`; }
        else { V[2] = { p: xr, f: fr }; msg = `f${sb('r')} &lt; f(B): expansión x${sb('e')} = ${pv(xe)} con f${sb('e')} = ${fm(fe)} no mejora; se queda la <b>reflexión</b>.`; }
      } else if (fr < V[1].f) { V[2] = { p: xr, f: fr }; msg = `f(B) ≤ f${sb('r')} &lt; f(M): se acepta la <b>reflexión</b>.`; }
      else {
        const xc = add(c, mul(sub(V[2].p, c), 0.5)), fc = ev(...xc); extra = [{ p: xc, c: C.vio, r: 5, label: 'xc' }];
        if (fc < V[2].f) { V[2] = { p: xc, f: fc }; msg = `f${sb('r')} ≥ f(M): <b>contracción</b> x${sb('c')} = c + ρ(W − c) = ${pv(xc)}, f${sb('c')} = ${fm(fc)} &lt; f(W): se acepta.`; }
        else {
          for (let i = 1; i < 3; i++) { const p = add(V[0].p, mul(sub(V[i].p, V[0].p), 0.5)); V[i] = { p, f: ev(...p) }; }
          msg = 'La contracción falla: <b>encogimiento</b> de todos los vértices hacia B.';
        }
      }
      V.sort((a, b) => a.f - b.f); setBest(S, V[0].p, V[0].f); hist.push(V[0].f); S.iter = k + 1; draw(extra);
      const size = Math.max(dist(V[0].p, V[1].p), dist(V[0].p, V[2].p));
      const info = op('3 · Decidir', msg) + `<p>Nuevo símplex con f = ${V.map(v => fm(v.f)).join(', ')}.</p>`;
      if (size < 1e-7 * rng2(F)) { yield { info: info + '<p class="ok">El símplex se encogió a un punto: terminó.</p>', end: true, stop: true }; return; }
      yield { info, end: true };
    }
  }
};

/* ---------------- 7. Recocido simulado ---------------- */
ALG.recocido = {
  nombre: 'Recocido simulado', kind: '2d', click: true, funcs: ['rastrigin', 'ackley', 'himmelblau', 'schwefel', 'griewank'],
  params: F => [{ k: 'T0', l: 'Temperatura inicial T₀', min: 0.5, max: 50, step: 0.5, v: 10 },
  { k: 'alfa', l: 'Enfriamiento α', min: 0.9, max: 0.999, step: 0.001, v: 0.98 },
  { k: 'sigma', l: 'σ del vecino', min: rng2(F) / 200, max: rng2(F) / 8, step: rng2(F) / 400, v: rng2(F) / 25 }],
  *gen(F, P, R, S, ev) {
    let x = (P.start || F.start).slice(), f = ev(...x), T = P.T0; const path = [x.slice()], hist = [f], best = [f];
    S.iter = 0; setBest(S, x, f); S.paths = [{ p: path, c: C.gold, w: 1.4, al: 0.7 }]; S.spark = { data: best, data2: hist, label: 'mejor (dorado) y actual (cian)' };
    S.pts = [{ p: x, c: C.w, r: 6 }];
    yield { info: op('Inicio', `x = ${pv(x)}, f = ${fm(f)}, T = ${fm(T)}`) + `<p>Criterio de Metropolis: un vecino peor (Δ &gt; 0) se acepta con P = e<sup>−Δ/T</sup>. Enfriamiento ${mono('T<sub>k+1</sub> = αT<sub>k</sub>')}.</p>`, end: true };
    for (let k = 0; k < 100000; k++) {
      const y = clampP(F, [x[0] + P.sigma * R.n(), x[1] + P.sigma * R.n()]), fy = ev(...y), D = fy - f;
      const Pa = D <= 0 ? 1 : Math.exp(-D / T), r = R.u(), acc = r < Pa;
      S.iter = k + 1; S.extra = `T = <b>${fm(T)}</b>`;
      S.pts = [{ p: x, c: C.w, r: 6 }, { p: y, c: acc ? C.lime : C.coral, r: 5, label: acc ? (D > 0 ? 'acepta (peor)' : 'acepta') : 'rechaza' }, ...(S.best ? [{ p: S.best.p, c: C.gold, star: true, r: 5 }] : [])];
      S.segs = [{ a: x, b: y, c: acc ? C.lime : C.coral, w: 1.6, dash: !acc }];
      const info = op('Iteración ' + (k + 1), `T = ${fm(T)}, Δ = f(y) − f(x) = ${fm(fy)} − ${fm(f)} = <b>${fm(D)}</b>`) +
        `<p>P = ${D <= 0 ? '1 (mejora)' : `e<sup>−${fm(D)}/${fm(T)}</sup> = <b>${fm(Pa)}</b>`}, r = ${fm(r)} → ${acc ? '<span class="ok">se acepta</span>' : '<span class="warn">se rechaza</span>'}${acc && D > 0 ? ' aunque es peor: así escapa de mínimos locales.' : '.'}</p>`;
      if (acc) { x = y; f = fy; path.push(x.slice()); if (path.length > 600) path.shift(); }
      setBest(S, x, f); hist.push(f); best.push(S.best.f); T *= P.alfa;
      if (T < 1e-4) { yield { info: info + '<p class="ok">La temperatura llegó casi a cero: ya solo acepta mejoras.</p>', end: true, stop: true }; return; }
      yield { info, end: true };
    }
  }
};

/* ---------------- 8. AG binario ---------------- */
const bitsStr = (b, cls) => b.map((v, i) => cls && cls[i] ? `<span class="${cls[i]}">${v}</span>` : v).join('');
ALG.agbin = {
  nombre: 'AG binario', kind: '1d', funcs1d: ['ondas'],
  params: () => [{ k: 'N', l: 'Población N', min: 4, max: 12, step: 2, v: 8 }, { k: 'pc', l: 'Prob. de cruza pc', min: 0, max: 1, step: 0.05, v: 0.8 }, { k: 'pmK', l: 'Prob. de mutación pm × L', min: 0, max: 4, step: 0.25, v: 1 }],
  *gen(G, P, R, S, ev) {
    const L = 12, N = P.N, pm = P.pmK / L, M = 2 ** L - 1;
    const dec = b => b.reduce((a, v) => a * 2 + v, 0), xOf = b => G.a + dec(b) * (G.b - G.a) / M;
    let pop = Array.from({ length: N }, () => Array.from({ length: L }, () => R.int(2)));
    let fit = pop.map(b => ev(xOf(b))); const hist = [];
    S.iter = 0; S.iterLabel = 'Generación';
    const showPop = (lbl = true) => { S.pts = pop.map((b, i) => ({ p: [xOf(b), G.f(xOf(b))], c: HUES[i % 16], r: 5, label: lbl ? String(i + 1) : '' })); };
    const tabla = (cols, rows) => `<table class="mini"><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
    const upd = () => { fit.forEach((f, i) => setBest(S, xOf(pop[i]), f, true)); hist.push(S.best.f); S.spark = { data: hist, label: 'mejor f', log: false }; };
    upd(); showPop();
    yield { info: op('Población inicial', `N = ${N}, L = ${L} bits, x = a + entero·(b − a)/(2<sup>L</sup> − 1)`) +
      tabla(['#', 'cromosoma', 'entero', 'x', 'f(x)'], pop.map((b, i) => [`<span style="color:${HUES[i]}">${i + 1}</span>`, `<span class="bits">${bitsStr(b)}</span>`, dec(b), fm(xOf(b), 4), fm(fit[i], 4)])), end: true };
    for (let gen = 1; gen < 100000; gen++) {
      const fmin = Math.min(...fit), Fp = fit.map(f => f - fmin + 0.01), tot = Fp.reduce((a, b) => a + b, 0), pr = Fp.map(v => v / tot);
      const acc = []; pr.reduce((a, v, i) => (acc[i] = a + v), 0);
      const rs = Array.from({ length: N }, () => R.u()), sel = rs.map(r => { const i = acc.findIndex(a => r <= a); return i < 0 ? N - 1 : i; });
      S.pie = { vals: Fp, cols: HUES.slice(0, N), r: rs }; showPop();
      yield { info: op('1 · Selección por ruleta', `Aptitud ajustada F′ = f − mín f + 0.01 (la ruleta necesita F′ ≥ 0)`) +
        tabla(['#', 'f(x)', 'F′', 'p = F′/ΣF′', 'acumulada'], pop.map((b, i) => [`<span style="color:${HUES[i]}">${i + 1}</span>`, fm(fit[i], 3), fm(Fp[i], 3), fm(pr[i], 3), fm(acc[i], 3)])) +
        `<p>Números r: ${rs.map((r, i) => `${fm(r, 2)}→<b style="color:${HUES[sel[i]]}">${sel[i] + 1}</b>`).join(', ')}. Las marcas blancas en la ruleta son los r.</p>` };
      const parents = sel.map(i => pop[i].slice()), kids = [], cls = [], lines = [];
      for (let i = 0; i < N; i += 2) {
        const a = parents[i], b = parents[i + 1], rc = R.u();
        if (rc < P.pc) {
          const cut = 1 + R.int(L - 1);
          kids.push([...a.slice(0, cut), ...b.slice(cut)], [...b.slice(0, cut), ...a.slice(cut)]);
          cls.push([...Array(cut).fill('pa'), ...Array(L - cut).fill('pb')], [...Array(cut).fill('pb'), ...Array(L - cut).fill('pa')]);
          lines.push(`<tr><td>${sel[i] + 1} × ${sel[i + 1] + 1}</td><td>${fm(rc, 2)} &lt; ${P.pc}: corte tras el gen ${cut}</td><td class="bits">${bitsStr(a.slice(0, cut), Array(cut).fill('pa'))}|${bitsStr(a.slice(cut), Array(L - cut).fill('pa'))}<br>${bitsStr(b.slice(0, cut), Array(cut).fill('pb'))}|${bitsStr(b.slice(cut), Array(L - cut).fill('pb'))}</td><td class="bits">${bitsStr(kids[i], cls[i])}<br>${bitsStr(kids[i + 1], cls[i + 1])}</td></tr>`);
        } else {
          kids.push(a.slice(), b.slice()); cls.push(Array(L).fill('pa'), Array(L).fill('pb'));
          lines.push(`<tr><td>${sel[i] + 1} × ${sel[i + 1] + 1}</td><td>${fm(rc, 2)} ≥ ${P.pc}: sin cruza</td><td class="bits">${bitsStr(a)}<br>${bitsStr(b)}</td><td class="bits">${bitsStr(kids[i], cls[i])}<br>${bitsStr(kids[i + 1], cls[i + 1])}</td></tr>`);
        }
      }
      S.pie = { vals: Fp, cols: HUES.slice(0, N), r: rs };
      S.pts = kids.map((b, i) => ({ p: [xOf(b), G.f(xOf(b))], c: C.w, r: 4, hollow: true }));
      yield { info: op('2 · Cruza de un punto', `parejas (1.º con 2.º, 3.º con 4.º, …), pc = ${P.pc}`) + `<table class="mini bitsT"><tr><th>pareja</th><th>decisión</th><th>padres</th><th>hijos</th></tr>${lines.join('')}</table><p><span class="pa">dorado</span>: genes del primer padre · <span class="pb">cian</span>: del segundo.</p>` };
      const mcls = kids.map(() => Array(L).fill('')); let flips = 0;
      kids.forEach((b, i) => b.forEach((v, j) => { if (R.u() < pm) { b[j] = 1 - v; mcls[i][j] = 'mu'; flips++; } }));
      const kfit = kids.map(b => ev(xOf(b)));
      S.pie = null; S.pts = kids.map((b, i) => ({ p: [xOf(b), G.f(xOf(b))], c: C.w, r: 4, hollow: true }));
      yield { info: op('3 · Mutación bit a bit', `pm = ${fm(pm, 3)} ≈ ${P.pmK}/L: ${flips} bit(s) invertidos (en rosa)`) +
        tabla(['hijo', 'cromosoma', 'x', 'f(x)'], kids.map((b, i) => [i + 1, `<span class="bits">${bitsStr(b, mcls[i])}</span>`, fm(xOf(b), 4), fm(kfit[i], 4)])) };
      const bi = fit.indexOf(Math.max(...fit)), wi = kfit.indexOf(Math.min(...kfit)), eliteNeeded = Math.max(...kfit) < fit[bi];
      if (eliteNeeded) { kids[wi] = pop[bi].slice(); kfit[wi] = fit[bi]; }
      const prom0 = fit.reduce((a, b) => a + b, 0) / N; pop = kids; fit = kfit; upd(); S.iter = gen; showPop();
      const prom1 = fit.reduce((a, b) => a + b, 0) / N;
      yield { info: op('4 · Elitismo y reemplazo', eliteNeeded ? `El mejor padre (f = ${fm(fit[wi], 4)}) reemplaza al peor hijo.` : 'Un hijo ya supera al mejor padre: no hace falta copiar la élite.') +
        `<p>Aptitud promedio: ${fm(prom0, 4)} → <b>${fm(prom1, 4)}</b>. Mejor: f = ${fm(S.best.f, 4)} en x = ${fm(S.best.p, 4)}.</p>`, end: true };
    }
  }
};

/* ---------------- 9. AG real ---------------- */
ALG.agreal = {
  nombre: 'AG con codificación real', kind: '2d', funcs: ['rastrigin', 'ackley', 'himmelblau', 'rosenbrock', 'schwefel', 'griewank'],
  params: F => [{ k: 'N', l: 'Población N', min: 6, max: 40, step: 2, v: 16 }, { k: 'pm', l: 'Prob. de mutación por gen', min: 0, max: 0.6, step: 0.05, v: 0.2 },
  { k: 'sigma', l: 'σ de la mutación', min: rng2(F) / 200, max: rng2(F) / 5, step: rng2(F) / 400, v: rng2(F) / 30 }, { k: 'elit', l: 'Elitismo (0 = no, 1 = sí)', min: 0, max: 1, step: 1, v: 1 }],
  *gen(F, P, R, S, ev) {
    let pop = Array.from({ length: P.N }, () => randIn(F, R)), fit = pop.map(p => ev(...p)); const hist = [];
    S.iter = 0; S.iterLabel = 'Generación';
    const showPop = (hi = []) => { S.pts = pop.map((p, i) => ({ p, c: hi.includes(i) ? C.gold : C.w, r: hi.includes(i) ? 6 : 4 })); };
    const upd = () => { fit.forEach((f, i) => setBest(S, pop[i], f)); hist.push(S.best.f); S.spark = { data: hist }; };
    const torneo = () => { const [a, b] = R.distinct(P.N, 2); return { a, b, w: fit[a] <= fit[b] ? a : b }; };
    const child = (p1, p2) => { const l = R.u(); return [add(mul(p1, l), mul(p2, 1 - l)), add(mul(p1, 1 - l), mul(p2, l)), l]; };
    const mutate = h => { const m = h.map(v => R.u() < P.pm ? v + P.sigma * R.n() : v); return clampP(F, m); };
    upd(); showPop();
    yield { info: op('Población inicial', `N = ${P.N} puntos al azar en el dominio`) + '<p>Cada individuo es directamente (x, y). Operadores: torneo binario, cruza aritmética, mutación gaussiana con recorte y elitismo.</p>', end: true };
    for (let gen = 1; gen < 100000; gen++) {
      const t1 = torneo(); showPop([t1.a, t1.b]); S.segs = [{ a: pop[t1.a], b: pop[t1.b], c: C.mute, w: 1, dash: true }]; S.pts.push({ p: pop[t1.w], c: C.gold, r: 6, ring: C.gold, label: 'p₁' });
      yield { info: op('1 · Torneo binario (padre 1)', `individuos ${t1.a + 1} (f = ${fm(fit[t1.a])}) y ${t1.b + 1} (f = ${fm(fit[t1.b])})`) + `<p>Gana el de menor f: <b>${t1.w + 1}</b>.</p>` };
      const t2 = torneo(); showPop([t2.a, t2.b]); S.segs = [{ a: pop[t2.a], b: pop[t2.b], c: C.mute, w: 1, dash: true }];
      S.pts.push({ p: pop[t1.w], c: C.gold, r: 6, ring: C.gold, label: 'p₁' }, { p: pop[t2.w], c: C.cyan, r: 6, ring: C.cyan, label: 'p₂', lc: C.cyan });
      yield { info: op('2 · Torneo binario (padre 2)', `individuos ${t2.a + 1} (f = ${fm(fit[t2.a])}) y ${t2.b + 1} (f = ${fm(fit[t2.b])})`) + `<p>Gana <b>${t2.w + 1}</b>.</p>` };
      const p1 = pop[t1.w], p2 = pop[t2.w], [h1, h2, lam] = child(p1, p2);
      showPop(); S.segs = [{ a: p1, b: p2, c: C.vio, w: 2 }];
      S.pts.push({ p: p1, c: C.gold, r: 6, label: 'p₁' }, { p: p2, c: C.cyan, r: 6, label: 'p₂', lc: C.cyan }, { p: h1, c: C.mag, r: 5, label: 'h₁', lc: C.mag }, { p: h2, c: C.mag, r: 5, label: 'h₂', lc: C.mag });
      yield { info: op('3 · Cruza aritmética', `λ = ${fm(lam)}`) + `<p>h₁ = λp₁ + (1 − λ)p₂ = <b>${pv(h1)}</b><br>h₂ = (1 − λ)p₁ + λp₂ = <b>${pv(h2)}</b></p><p>Los hijos siempre quedan sobre el segmento entre los padres.</p>` };
      const m1 = mutate(h1); showPop(); S.segs = [{ a: h1, b: m1, c: C.lime, w: 2, head: true }];
      S.pts.push({ p: h1, c: C.mag, r: 4 }, { p: m1, c: C.lime, r: 6, label: 'h₁ mutado', lc: C.lime });
      yield { info: op('4 · Mutación gaussiana y recorte', `cada gen cambia con prob. ${P.pm}: x′ = x + N(0, σ²), σ = ${fm(P.sigma)}`) + `<p>${pv(h1)} → <b>${pv(m1)}</b>${m1[0] === h1[0] && m1[1] === h1[1] ? ' (no le tocó mutación)' : ''}. Si sale del dominio se recorta al borde.</p>` };
      const kids = [m1, mutate(h2)];
      while (kids.length < P.N) { const a = torneo().w, b = torneo().w, [c1, c2] = child(pop[a], pop[b]); kids.push(mutate(c1)); if (kids.length < P.N) kids.push(mutate(c2)); }
      const kf = kids.map(p => ev(...p)), bi = fit.indexOf(Math.min(...fit));
      let msg = 'Sin elitismo: la nueva generación son solo los hijos.';
      if (P.elit) { const wi = kf.indexOf(Math.max(...kf)); kids[wi] = pop[bi].slice(); kf[wi] = fit[bi]; msg = `Elitismo: el mejor de la generación anterior (f = ${fm(fit[bi])}) sustituye al peor hijo.`; }
      pop = kids; fit = kf; S.iter = gen; upd(); showPop(); S.segs = []; S.pts.push({ p: S.best.p, c: C.gold, star: true, r: 6 });
      yield { info: op('5 · Resto de la generación', `se repiten torneo, cruza y mutación hasta tener ${P.N} hijos`) + `<p>${msg} Mejor f = ${fm(S.best.f)}.</p>`, end: true };
    }
  }
};

/* ---------------- 10. AG de permutaciones (agente viajero) ---------------- */
function cities(n, seed) { const R = new Rng(seed); const c = []; let md = 0.12, t = 0; while (c.length < n) { const p = [R.u(0.06, 0.94), R.u(0.06, 0.94)]; if (c.every(q => dist(p, q) > md)) c.push(p); if (++t % 2000 === 0) md *= 0.85; } return c; }
const tourLen = (t, D) => t.reduce((a, c, i) => a + D[c][t[(i + 1) % t.length]], 0);
const cells = (arr, cls) => `<span class="perm">${arr.map((v, i) => `<i class="${cls ? cls[i] || '' : ''}">${v === null ? '_' : v}</i>`).join('')}</span>`;
ALG.agperm = {
  nombre: 'AG para permutaciones', kind: 'tsp',
  params: () => [{ k: 'n', l: 'Ciudades', min: 6, max: 20, step: 1, v: 12 }, { k: 'N', l: 'Población', min: 10, max: 60, step: 2, v: 30 }, { k: 'pm', l: 'Prob. de mutación', min: 0, max: 1, step: 0.05, v: 0.3 }],
  *gen(_, P, R, S, ev) {
    const X = P.cities || cities(P.n, 11 + P.n), D = X.map(a => X.map(b => dist(a, b))), n = X.length;
    let pop = Array.from({ length: P.N }, () => R.perm(n)), fit = pop.map(t => ev(tourLen(t, D))); const hist = [];
    S.iter = 0; S.iterLabel = 'Generación';
    const route = (t, c, w, al = 1, dash) => ({ p: t.map(i => X[i]), c, w, closed: true, al, dash });
    const cityPts = () => X.map((p, i) => ({ p, c: i === 0 && P.names ? C.gold : C.w, r: i === 0 && P.names ? 7 : 5, label: P.names ? P.names[i] : String(i) }));
    const upd = () => { fit.forEach((f, i) => { if (!S.best || f < S.best.f) S.best = { p: pop[i].slice(), f }; }); hist.push(S.best.f); S.spark = { data: hist, label: 'mejor ruta', log: false }; };
    const torneo = () => { const c = R.distinct(P.N, 3); return c.reduce((a, b) => fit[a] <= fit[b] ? a : b); };
    const OX = (p1, p2, a, b) => { const h = Array(n).fill(null); for (let i = a; i <= b; i++) h[i] = p1[i]; let k = 0; for (const g of p2) { if (h.includes(g)) continue; while (h[k] !== null) k++; h[k] = g; } return h; };
    upd(); S.paths = [route(S.best.p, C.gold, 2.4)]; S.pts = cityPts();
    yield { info: op('Población inicial', `${P.N} rutas al azar sobre ${n} ciudades`) + '<p>Cada cromosoma es una permutación: el orden de visita. Cruza de orden (OX) y mutación por intercambio: nunca se repiten ciudades.</p>', end: true };
    for (let gen = 1; gen < 100000; gen++) {
      const i1 = torneo(), i2 = torneo(), p1 = pop[i1], p2 = pop[i2];
      S.paths = [route(p1, C.gold, 2, 0.75), route(p2, C.cyan, 2, 0.75, true)]; S.pts = cityPts();
      yield { info: op('1 · Selección por torneo (k = 3)', `p₁ longitud ${fm(fit[i1])}, p₂ longitud ${fm(fit[i2])}`) + `<p>p₁ ${cells(p1)}<br>p₂ ${cells(p2)}</p>` };
      let a = R.int(n), b = R.int(n); if (a > b) [a, b] = [b, a];
      const h = OX(p1, p2, a, b), hc = h.map((v, i) => i >= a && i <= b ? 'a' : 'b'), seg = Array(n).fill(null).map((_, i) => i >= a && i <= b ? p1[i] : null);
      S.paths = [route(p1, C.gold, 1.4, 0.35), route(p2, C.cyan, 1.4, 0.35, true), route(h, C.mag, 2.6)];
      yield { info: op('2 · Cruza de orden (OX)', `segmento de p₁ en las posiciones ${a} a ${b}`) +
        `<p>p₁ ${cells(p1, p1.map((_, i) => i >= a && i <= b ? 'a' : ''))}<br>p₂ ${cells(p2, p2.map(g => seg.includes(g) ? 'x' : 'b'))}<br>paso 1 ${cells(seg, seg.map(v => v === null ? '' : 'a'))}<br>hijo ${cells(h, hc)}</p><p>Se copia el segmento de p₁ y se completan los huecos con p₂ en su orden, saltando las ciudades ya usadas (tachadas).</p>` };
      let m = h.slice(), sw = null;
      if (R.u() < P.pm) { const [i, j] = R.distinct(n, 2); [m[i], m[j]] = [m[j], m[i]]; sw = [i, j]; }
      S.paths = [route(m, C.lime, 2.6)];
      yield { info: op('3 · Mutación por intercambio', sw ? `se intercambian las posiciones ${sw[0]} y ${sw[1]}` : 'no le tocó mutación') + `<p>${cells(m, m.map((_, i) => sw && sw.includes(i) ? 'm' : ''))} · longitud ${fm(tourLen(m, D))}</p>` };
      const kids = [m]; while (kids.length < P.N) { const q1 = pop[torneo()], q2 = pop[torneo()]; let x = R.int(n), y = R.int(n); if (x > y) [x, y] = [y, x]; let c = OX(q1, q2, x, y); if (R.u() < P.pm) { const [i, j] = R.distinct(n, 2); [c[i], c[j]] = [c[j], c[i]]; } kids.push(c); }
      const kf = kids.map(t => ev(tourLen(t, D))), order = fit.map((f, i) => i).sort((u, v) => fit[u] - fit[v]), korder = kf.map((f, i) => i).sort((u, v) => kf[v] - kf[u]);
      for (let e = 0; e < 2; e++) { kids[korder[e]] = pop[order[e]].slice(); kf[korder[e]] = fit[order[e]]; }
      pop = kids; fit = kf; S.iter = gen; upd(); S.paths = [route(S.best.p, C.gold, 2.6)];
      yield { info: op('4 · Resto de la generación y elitismo', 'las 2 mejores rutas pasan sin cambio') + `<p>Mejor ruta: <b>${fm(S.best.f, 4)}</b> ${cells(S.best.p)}</p>`, end: true };
    }
  }
};

/* ---------------- 11. PSO ---------------- */
ALG.pso = {
  nombre: 'Enjambre de partículas (PSO)', kind: '2d', funcs: ['rastrigin', 'ackley', 'himmelblau', 'rosenbrock', 'schwefel', 'griewank', 'easom'],
  params: () => [{ k: 'N', l: 'Partículas', min: 4, max: 40, step: 1, v: 15 }, { k: 'w', l: 'Inercia w', min: 0, max: 1.2, step: 0.05, v: 0.7 }, { k: 'c1', l: 'Cognitiva c₁', min: 0, max: 3, step: 0.1, v: 1.5 }, { k: 'c2', l: 'Social c₂', min: 0, max: 3, step: 0.1, v: 1.5 }],
  *gen(F, P, R, S, ev) {
    const vmax = 0.2 * rng2(F), N = P.N;
    let X = Array.from({ length: N }, () => randIn(F, R)), V = Array.from({ length: N }, () => [R.u(-vmax, vmax) / 2, R.u(-vmax, vmax) / 2]);
    let fx = X.map(p => ev(...p)), Pb = X.map(p => p.slice()), fp = fx.slice(); const hist = [];
    let gi = fp.indexOf(Math.min(...fp)), g = Pb[gi].slice(), fg = fp[gi];
    S.iter = 0; setBest(S, g, fg); hist.push(fg); S.spark = { data: hist };
    const sw = (hi = -1) => {
      S.pts = [...Pb.map(p => ({ p, c: 'rgba(98,230,255,.7)', r: 2.5, hollow: true })), ...X.map((p, i) => ({ p, c: i === hi ? C.gold : C.w, r: i === hi ? 6 : 4 })), { p: g, c: C.gold, star: true, r: 7, label: 'g' }];
      S.segs = X.map((p, i) => ({ a: p, b: add(p, V[i]), c: 'rgba(245,243,255,.45)', w: 1 }));
    };
    const clampV = v => v.map(c => Math.max(-vmax, Math.min(vmax, c)));
    sw();
    yield { info: op('Enjambre inicial', `${N} partículas con posición x y velocidad v`) + `<p>${mono('v ← w·v + c₁r₁(p − x) + c₂r₂(g − x)')}, ${mono('x ← x + v')}. Círculos cian: mejor posición de cada partícula (p). Estrella: mejor global (g).</p>`, end: true };
    for (let it = 1; it < 100000; it++) {
      const i = (it - 1) % N, x = X[i], r1 = R.u(), r2 = R.u();
      const vi = mul(V[i], P.w), vc = mul(sub(Pb[i], x), P.c1 * r1), vs = mul(sub(g, x), P.c2 * r2), nv = clampV(add(add(vi, vc), vs));
      sw(i); S.segs = [{ a: x, b: add(x, vi), c: C.vio, w: 2.4, head: true, label: 'inercia' }, { a: add(x, vi), b: add(add(x, vi), vc), c: C.cyan, w: 2.4, head: true, label: 'cognitiva' },
      { a: add(add(x, vi), vc), b: add(add(add(x, vi), vc), vs), c: C.coral, w: 2.4, head: true, label: 'social' }, { a: x, b: add(x, nv), c: C.gold, w: 3, head: true }];
      yield { info: op(`1 · Velocidad de la partícula ${i + 1}`, `r₁ = ${fm(r1)}, r₂ = ${fm(r2)}`) +
        `<p><span style="color:${C.vio}">inercia</span> w·v = ${pv(vi)}<br><span style="color:${C.cyan}">cognitiva</span> c₁r₁(p − x) = ${pv(vc)}<br><span style="color:${C.coral}">social</span> c₂r₂(g − x) = ${pv(vs)}<br><span style="color:${C.gold}">v nueva</span> = <b>${pv(nv)}</b>${Math.abs(nv[0]) === vmax || Math.abs(nv[1]) === vmax ? ' (limitada a v<sub>máx</sub>)' : ''}</p>` };
      const upd = j => {
        if (j !== i) { V[j] = clampV(add(add(mul(V[j], P.w), mul(sub(Pb[j], X[j]), P.c1 * R.u())), mul(sub(g, X[j]), P.c2 * R.u()))); }
        else V[j] = nv;
        X[j] = clampP(F, add(X[j], V[j])); fx[j] = ev(...X[j]);
        if (fx[j] < fp[j]) { fp[j] = fx[j]; Pb[j] = X[j].slice(); }
        if (fx[j] < fg) { fg = fx[j]; g = X[j].slice(); }
      };
      const old = x.slice(); upd(i); setBest(S, g, fg); sw(i);
      S.segs.push({ a: old, b: X[i], c: C.gold, w: 2, head: true });
      yield { info: op('2 · Mover y actualizar memorias', `x = ${pv(old)} + ${pv(nv)} = <b>${pv(X[i])}</b>, f = ${fm(fx[i])}`) + `<p>p${sb(i + 1)}: f = ${fm(fp[i])} · g: f = ${fm(fg)}</p>` };
      for (let j = 0; j < N; j++) if (j !== i) upd(j);
      setBest(S, g, fg); hist.push(fg); S.iter = it; sw();
      yield { info: op('3 · Resto del enjambre', 'todas las partículas aplican la misma regla') + `<p>Mejor global g = ${pv(g)}, f = ${fm(fg)}.</p>`, end: true };
    }
  }
};

/* ---------------- 12. Colonia de hormigas ---------------- */
ALG.aco = {
  nombre: 'Colonia de hormigas (ACO)', kind: 'tsp',
  params: () => [{ k: 'n', l: 'Ciudades', min: 5, max: 16, step: 1, v: 9 }, { k: 'm', l: 'Hormigas', min: 2, max: 20, step: 1, v: 8 }, { k: 'alpha', l: 'α (peso de la feromona)', min: 0, max: 3, step: 0.1, v: 1 }, { k: 'beta', l: 'β (peso de la distancia)', min: 0, max: 5, step: 0.1, v: 2 }, { k: 'rho', l: 'ρ (evaporación)', min: 0.05, max: 0.9, step: 0.05, v: 0.3 }],
  *gen(_, P, R, S, ev) {
    const X = P.cities || cities(P.n, 23 + P.n), n = X.length, D = X.map(a => X.map(b => dist(a, b))), eta = D.map(r => r.map(d => d > 0 ? 1 / d : 0));
    let tau = D.map(r => r.map(() => 1)); const hist = []; S.iter = 0;
    const edges = () => { const mx = Math.max(...tau.flat()); const E = []; for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) E.push({ a: X[i], b: X[j], c: C.cyan, w: 0.5 + 7 * tau[i][j] / mx, al: 0.08 + 0.6 * tau[i][j] / mx }); return E; };
    const cp = () => X.map((p, i) => ({ p, c: i === 0 && P.names ? C.gold : C.w, r: i === 0 && P.names ? 7 : 5, label: P.names ? P.names[i] : String(i) }));
    const build = () => { const t = [R.int(n)]; while (t.length < n) { const i = t[t.length - 1], al = [...Array(n).keys()].filter(j => !t.includes(j)); const w = al.map(j => tau[i][j] ** P.alpha * eta[i][j] ** P.beta), s = w.reduce((a, b) => a + b, 0); let r = R.u() * s, k = 0; while (r > w[k] && k < w.length - 1) { r -= w[k]; k++; } t.push(al[k]); } return t; };
    S.edges = edges(); S.pts = cp();
    yield { info: op('Inicio', `τ = 1 en todas las aristas, η = 1/d`) + `<p>Regla de transición ${mono('p<sub>ij</sub> = τ<sub>ij</sub><sup>α</sup>η<sub>ij</sub><sup>β</sup> / Σ τ<sup>α</sup>η<sup>β</sup>')}. El grosor de cada arista es su feromona.</p>`, end: true };
    for (let it = 1; it < 100000; it++) {
      const t = [R.int(n)];
      S.edges = edges(); S.paths = []; S.pts = cp();
      while (t.length < n) {
        const i = t[t.length - 1], al = [...Array(n).keys()].filter(j => !t.includes(j));
        const w = al.map(j => tau[i][j] ** P.alpha * eta[i][j] ** P.beta), s = w.reduce((a, b) => a + b, 0), pr = w.map(v => v / s);
        const r = R.u(); let acc = 0, k = 0; for (; k < pr.length - 1; k++) { acc += pr[k]; if (r <= acc) break; }
        const j = al[k];
        S.paths = [{ p: t.map(c => X[c]), c: C.gold, w: 3 }]; S.segs = al.map((c, q) => ({ a: X[i], b: X[c], c: q === k ? C.gold : C.mute, w: 1 + 6 * pr[q], dash: q !== k, al: 0.9 }));

        const rows = al.map((c, q) => `<tr${q === k ? ' class="hl"' : ''}><td>${i}→${c}</td><td>${fm(tau[i][c])}</td><td>${fm(D[i][c])}</td><td>${fm(w[q])}</td><td>${fm(pr[q])}</td></tr>`).join('');
        yield { info: op(`1 · Hormiga 1 en la ciudad ${i}`, `r = ${fm(r)} → elige la ciudad <b>${j}</b>`) + `<table class="mini"><tr><th>arista</th><th>τ</th><th>d</th><th>τ<sup>α</sup>η<sup>β</sup></th><th>p</th></tr>${rows}</table>` };
        t.push(j);
      }
      const tours = [t, ...Array.from({ length: P.m - 1 }, build)], Ls = tours.map(tt => ev(tourLen(tt, D)));
      S.segs = []; S.paths = tours.map((tt, q) => ({ p: tt.map(c => X[c]), c: q ? C.w : C.gold, w: q ? 1 : 2.6, closed: true, al: q ? 0.25 : 1 }));
      yield { info: op('2 · Las demás hormigas', `${P.m} rutas construidas`) + `<p>Longitudes: ${Ls.map(L => fm(L)).join(', ')}.</p>` };
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) tau[i][j] *= (1 - P.rho);
      tours.forEach((tt, q) => tt.forEach((c, k) => { const d2 = tt[(k + 1) % n]; tau[c][d2] += 1 / Ls[q]; tau[d2][c] += 1 / Ls[q]; }));
      Ls.forEach((L, q) => { if (!S.best || L < S.best.f) S.best = { p: tours[q].slice(), f: L }; });
      hist.push(S.best.f); S.spark = { data: hist, label: 'mejor ruta', log: false }; S.iter = it;
      S.edges = edges(); S.paths = [{ p: S.best.p.map(c => X[c]), c: C.gold, w: 2.6, closed: true }];
      yield { info: op('3 · Evaporación y depósito', `τ ← (1 − ρ)τ + Σ Q/L<sub>k</sub>, ρ = ${P.rho}, Q = 1`) + `<p>Las aristas de rutas cortas reciben más feromona. Mejor ruta: <b>${fm(S.best.f, 4)}</b> ${cells(S.best.p)}</p>`, end: true };
    }
  }
};

/* ---------------- 13. Colonia artificial de abejas ---------------- */
ALG.abc = {
  nombre: 'Colonia artificial de abejas (ABC)', kind: '2d', funcs: ['rastrigin', 'ackley', 'himmelblau', 'rosenbrock', 'griewank', 'schwefel'],
  params: () => [{ k: 'SN', l: 'Fuentes de alimento', min: 3, max: 20, step: 1, v: 8 }, { k: 'limit', l: 'Límite de intentos', min: 2, max: 40, step: 1, v: 10 }],
  *gen(F, P, R, S, ev) {
    const SN = P.SN; let X = Array.from({ length: SN }, () => randIn(F, R)), fx = X.map(p => ev(...p)), tr = Array(SN).fill(0); const hist = [];
    const fit = f => f >= 0 ? 1 / (1 + f) : 1 + Math.abs(f);
    S.iter = 0; S.iterLabel = 'Ciclo';
    const show = () => { S.pts = [...X.map((p, i) => ({ p, c: HUES[i % 16], r: 5, label: 't=' + tr[i] })), ...(S.best ? [{ p: S.best.p, c: C.gold, star: true, r: 6 }] : [])]; };
    const nb = i => { let k; do k = R.int(SN); while (k === i); const j = R.int(2), phi = R.u(-1, 1), v = X[i].slice(); v[j] = X[i][j] + phi * (X[i][j] - X[k][j]); return { v: clampP(F, v), k, j, phi }; };
    const tryi = i => { const o = nb(i), fv = ev(...o.v), ok = fv < fx[i]; const old = X[i]; if (ok) { X[i] = o.v; fx[i] = fv; tr[i] = 0; } else tr[i]++; return { ...o, fv, ok, old }; };
    const upd = () => { fx.forEach((f, i) => setBest(S, X[i], f)); hist.push(S.best.f); S.spark = { data: hist }; };
    upd(); show();
    yield { info: op('Inicio', `${SN} fuentes de alimento (soluciones); t = intentos sin mejora`) + `<p>Vecino: ${mono('v<sub>ij</sub> = x<sub>ij</sub> + φ(x<sub>ij</sub> − x<sub>kj</sub>)')}, φ ∼ U(−1, 1), en una sola coordenada j.</p>`, end: true };
    for (let cyc = 1; cyc < 100000; cyc++) {
      const res = X.map((_, i) => tryi(i)); show();
      S.segs = res.map(r => ({ a: r.old, b: r.v, c: r.ok ? C.lime : C.coral, w: 1.6, head: true, dash: !r.ok }));
      const r0 = res[0];
      yield { info: op('1 · Abejas empleadas', 'cada fuente prueba un vecino y se queda con el mejor (voraz)') +
        `<p>Fuente 1: k = ${r0.k + 1}, j = ${r0.j === 0 ? 'x' : 'y'}, φ = ${fm(r0.phi)} → v = ${pv(r0.v)}, f(v) = ${fm(r0.fv)} ${r0.ok ? '<span class="ok">mejora</span>' : '<span class="warn">no mejora (t + 1)</span>'}.</p><p>Verde: aceptado · rojo: rechazado. ${res.filter(r => r.ok).length} de ${SN} mejoraron.</p>` };
      const ft = fx.map(fit), s = ft.reduce((a, b) => a + b, 0), pr = ft.map(v => v / s), picks = [];
      for (let q = 0; q < SN; q++) { let r = R.u(), i = 0, acc = pr[0]; while (r > acc && i < SN - 1) { i++; acc += pr[i]; } picks.push(i); }
      S.pie = { vals: ft, cols: HUES.slice(0, SN), title: 'probabilidad' };
      const res2 = picks.map(i => tryi(i)); show(); S.segs = res2.map(r => ({ a: r.old, b: r.v, c: r.ok ? C.lime : C.coral, w: 1.6, head: true, dash: !r.ok }));
      const cnt = picks.reduce((m, i) => (m[i] = (m[i] || 0) + 1, m), {});
      yield { info: op('2 · Abejas observadoras', 'eligen fuentes con probabilidad proporcional a la aptitud (ruleta)') +
        `<p>aptitud = 1/(1 + f). Probabilidades: ${pr.map((p, i) => `<span style="color:${HUES[i]}">${fm(p, 2)}</span>`).join(' · ')}</p><p>Visitas: ${Object.entries(cnt).map(([i, c]) => `fuente ${+i + 1} ×${c}`).join(', ')}. Las buenas fuentes se explotan más.</p>` };
      S.pie = null;
      const mi = tr.indexOf(Math.max(...tr)); let msg = `Ninguna fuente supera el límite (${P.limit}).`; S.segs = [];
      if (tr[mi] > P.limit) { const old = X[mi]; X[mi] = randIn(F, R); fx[mi] = ev(...X[mi]); tr[mi] = 0; S.segs = [{ a: old, b: X[mi], c: C.mag, w: 2, head: true, dash: true }]; msg = `La fuente ${mi + 1} superó el límite: su abeja se vuelve <b>exploradora</b> y busca una fuente nueva al azar (flecha rosa).`; }
      upd(); S.iter = cyc; show();
      yield { info: op('3 · Abejas exploradoras', 'abandonan fuentes agotadas') + `<p>${msg}</p><p>Mejor f = ${fm(S.best.f)} en ${pv(S.best.p)}.</p>`, end: true };

/* ---------------- 14. Evolución diferencial ---------------- */
ALG.de = {
  nombre: 'Evolución diferencial (DE)', kind: '2d', funcs: ['rastrigin', 'ackley', 'himmelblau', 'rosenbrock', 'schwefel', 'griewank'],
  params: () => [{ k: 'N', l: 'Población N', min: 4, max: 40, step: 1, v: 12 }, { k: 'Fs', l: 'Factor F', min: 0.1, max: 1.5, step: 0.05, v: 0.8 }, { k: 'CR', l: 'Cruza CR', min: 0, max: 1, step: 0.05, v: 0.9 }],
  *gen(F, P, R, S, ev) {
    let X = Array.from({ length: P.N }, () => randIn(F, R)), fx = X.map(p => ev(...p)); const hist = [];
    S.iter = 0; S.iterLabel = 'Generación';
    const show = (hi = {}) => { S.pts = [...X.map((p, i) => ({ p, c: hi[i] ? hi[i][0] : C.w, r: hi[i] ? 6 : 4, label: hi[i] ? hi[i][1] : '', lc: hi[i] ? hi[i][0] : C.w })), ...(S.best ? [{ p: S.best.p, c: C.gold, star: true, r: 5 }] : [])]; };
    const upd = () => { fx.forEach((f, i) => setBest(S, X[i], f)); hist.push(S.best.f); S.spark = { data: hist }; };
    const trial = i => { const [a, b, c] = R.distinct(P.N, 3, [i]); const v = clampP(F, add(X[a], mul(sub(X[b], X[c]), P.Fs))); const jr = R.int(2), rj = [R.u(), R.u()]; const u = [0, 1].map(j => (rj[j] < P.CR || j === jr) ? v[j] : X[i][j]); return { a, b, c, v, u, jr, rj }; };
    upd(); show();
    yield { info: op('Población inicial', `N = ${P.N}`) + `<p>DE/rand/1/bin: ${mono('v = x<sub>r1</sub> + F(x<sub>r2</sub> − x<sub>r3</sub>)')}, cruza binomial con CR y selección voraz.</p>`, end: true };
    for (let gen = 1; gen < 100000; gen++) {
      const i = (gen - 1) % P.N, t = trial(i);
      show({ [i]: [C.gold, 'xᵢ'], [t.a]: [C.cyan, 'r1'], [t.b]: [C.lime, 'r2'], [t.c]: [C.coral, 'r3'] }); S.segs = [];
      yield { info: op('1 · Elegir vectores', `objetivo x${sb('i')} = individuo ${i + 1}; r1, r2, r3 distintos de i`) + `<p>r1 = ${t.a + 1} ${pv(X[t.a])}, r2 = ${t.b + 1} ${pv(X[t.b])}, r3 = ${t.c + 1} ${pv(X[t.c])}</p>` };
      const diff = sub(X[t.b], X[t.c]);
      S.segs = [{ a: X[t.c], b: X[t.b], c: C.lime, w: 1.6, head: true, dash: true, label: 'x₂ − x₃' }, { a: X[t.a], b: t.v, c: C.mag, w: 2.6, head: true, label: 'F·(x₂ − x₃)' }];
      S.pts.push({ p: t.v, c: C.mag, r: 6, label: 'v', lc: C.mag });
      yield { info: op('2 · Mutación diferencial', `v = x${sb('r1')} + ${P.Fs}·${pv(diff)} = <b>${pv(t.v)}</b>`) + '<p>La diferencia entre dos individuos da el tamaño y la dirección del paso: se adapta sola a la dispersión de la población.</p>' };
      S.segs = [{ a: X[i], b: t.u, c: C.vio, w: 2, head: true }]; S.pts.push({ p: t.u, c: C.vio, r: 6, label: 'u', lc: C.vio });
      yield { info: op('3 · Cruza binomial', `CR = ${P.CR}, j<sub>rand</sub> = ${t.jr === 0 ? 'x' : 'y'}`) +
        `<p>${['x', 'y'].map((n, j) => `${n}: r = ${fm(t.rj[j], 2)} ${t.rj[j] < P.CR || j === t.jr ? `→ de v (${fm(t.v[j])})` : `→ de xᵢ (${fm(X[i][j])})`}`).join('<br>')}</p><p>u = <b>${pv(t.u)}</b></p>` };
      const fu = ev(...t.u), ok = fu <= fx[i];
      yield { info: op('4 · Selección voraz', `f(u) = ${fm(fu)} vs f(xᵢ) = ${fm(fx[i])}`) + `<p>${ok ? '<span class="ok">u reemplaza a xᵢ.</span>' : '<span class="warn">Se conserva xᵢ.</span>'}</p>` };
      const NX = X.map(p => p.slice()), NF = fx.slice(); if (ok) { NX[i] = t.u; NF[i] = fu; }
      for (let j = 0; j < P.N; j++) if (j !== i) { const q = trial(j), fq = ev(...q.u); if (fq <= fx[j]) { NX[j] = q.u; NF[j] = fq; } }
      X = NX; fx = NF; upd(); S.iter = gen; S.segs = []; show();
      yield { info: op('5 · Resto de la población', 'cada individuo compite contra su propio vector de prueba') + `<p>Mejor f = ${fm(S.best.f)} en ${pv(S.best.p)}.</p>`, end: true };
    }
  }
};

/* ---------------- 15. Luciérnagas ---------------- */
ALG.luciernagas = {
  nombre: 'Algoritmo de luciérnagas', kind: '2d', funcs: ['rastrigin', 'himmelblau', 'ackley', 'griewank', 'easom'],
  params: F => [{ k: 'N', l: 'Luciérnagas', min: 4, max: 30, step: 1, v: 12 }, { k: 'gamma', l: 'γ (absorción de la luz)', min: 0, max: 40 / rng2(F) ** 2, step: 0.4 / rng2(F) ** 2, v: 6 / rng2(F) ** 2 },
  { k: 'alpha', l: 'α (aleatoriedad)', min: 0, max: rng2(F) / 10, step: rng2(F) / 1000, v: rng2(F) / 50 }],
  *gen(F, P, R, S, ev) {
    let X = Array.from({ length: P.N }, () => randIn(F, R)), fx = X.map(p => ev(...p)), al = P.alpha; const hist = [], b0 = 1;
    S.iter = 0; S.iterLabel = 'Generación';
    const show = (hi = -1) => { const order = fx.map((f, i) => i).sort((a, b) => fx[a] - fx[b]); S.pts = X.map((p, i) => ({ p, c: i === hi ? C.mag : C.gold, r: i === hi ? 6 : 4, glow: 8 + 22 * (1 - order.indexOf(i) / P.N) })); };
    const upd = () => { fx.forEach((f, i) => setBest(S, X[i], f)); hist.push(S.best.f); S.spark = { data: hist }; };
    const move = i => { const steps = []; for (let j = 0; j < P.N; j++) if (fx[j] < fx[i]) { const r2 = (X[i][0] - X[j][0]) ** 2 + (X[i][1] - X[j][1]) ** 2, be = b0 * Math.exp(-P.gamma * r2), eps = [R.n(), R.n()], old = X[i]; X[i] = clampP(F, add(add(old, mul(sub(X[j], old), be)), mul(eps, al))); fx[i] = ev(...X[i]); steps.push({ j, r2, be, old, nw: X[i] }); } return steps; };
    upd(); show();
    yield { info: op('Inicio', `${P.N} luciérnagas; el brillo es mayor mientras menor es f`) + `<p>${mono('β(r) = β₀e<sup>−γr²</sup>')}, ${mono('xᵢ ← xᵢ + β(xⱼ − xᵢ) + α·ε')}. El halo indica el brillo.</p>`, end: true };
    for (let gen = 1; gen < 100000; gen++) {
      const order = fx.map((f, k) => k).sort((a, b) => fx[b] - fx[a]), i = order[(gen - 1) % Math.max(1, P.N - 1)];
      const steps = move(i); show(i);
      S.segs = steps.map(s => ({ a: s.old, b: s.nw, c: C.mag, w: 1.8, head: true }));
      const s0 = steps[0];
      yield { info: op(`1 · Luciérnaga ${i + 1}`, steps.length ? `se mueve hacia ${steps.length} luciérnaga(s) más brillante(s)` : 'es la más brillante: no se mueve hacia nadie') +
        (s0 ? `<p>Primera atracción (hacia ${s0.j + 1}): r² = ${fm(s0.r2)}, β = e<sup>−${fm(P.gamma, 4)}·${fm(s0.r2)}</sup> = <b>${fm(s0.be)}</b><br>${pv(s0.old)} → ${pv(s0.nw)}</p><p>${P.gamma * s0.r2 > 4 ? 'γr² grande: la atracción es casi nula, la luz no llega tan lejos.' : 'Está cerca: la atracción es fuerte.'}</p>` : '') };
      for (const k of order) if (k !== i) move(k);
      al *= 0.97; upd(); S.iter = gen; S.segs = []; show();
      yield { info: op('2 · Resto de las luciérnagas', `α se reduce: α = ${fm(al)}`) + `<p>Mejor f = ${fm(S.best.f)} en ${pv(S.best.p)}. Con γ grande se forman varios grupos, cada uno alrededor de un óptimo local.</p>`, end: true };
    }
  }
};

/* ---------- diapositiva de algoritmo ---------- */
function buildAlg(sec, key) {
  const def = ALG[key], T = TXT[key];
  sec.innerHTML = `<div class="grid"><div class="theory"><div class="eyebrow">${SEC[T.sec]}</div><h2>${def.nombre}</h2><div class="who">${T.who}</div>
    <p>${T.idea}</p><div class="eqs">${T.eqs.map(e => `<div class="eq">${e}</div>`).join('')}</div>
    <h3>Cómo leer la animación</h3><ul class="read">${T.read.map(r => `<li>${r}</li>`).join('')}</ul>
    <div class="ctrls" id="c-${key}"></div></div>
   <div class="demo"><div class="cvwrap ${def.kind === '1d' ? 'wide' : ''}"><canvas id="cv-${key}" aria-label="Demostración de ${def.nombre}"></canvas></div>
    <div class="btns"><button class="pri" data-a="step">Paso detallado</button><button data-a="iter">Iteración completa</button><button data-a="play">▶ Animar</button><button data-a="reset">Reiniciar</button>
     <span class="speed"><label for="sp-${key}">Velocidad</label><input type="range" id="sp-${key}" min="1" max="30" value="4"></span></div>
    <div class="stats" id="st-${key}"></div><div class="info" id="in-${key}" aria-live="polite"></div></div></div>`;
  const plot = new Plot(sec.querySelector('#cv-' + key)), run = new Runner({ plot, info: sec.querySelector('#in-' + key), stats: sec.querySelector('#st-' + key) });
  const ctr = sec.querySelector('#c-' + key), playB = sec.querySelector('[data-a=play]');
  run.onState = on => { playB.textContent = on ? '❚❚ Pausa' : '▶ Animar'; };
  const fl = def.kind === '2d' ? def.funcs : def.kind === '1d' ? def.funcs1d : null;
  let fid = fl ? fl[0] : null, P = {}, seed = 7;
  const getF = () => def.kind === '2d' ? FUNCS[fid] : def.kind === '1d' ? F1D[fid] : null;
  const restart = () => { run.load(def, getF(), { ...P }, seed); };
  const buildCtrls = () => {
    const F = getF(); P = defaultsOf(def, F); ctr.innerHTML = '';
    if (fl) {
      const d = el('div', { class: 'ctrl' }, `<label for="f-${key}">Función</label>`), s = el('select', { id: 'f-' + key });
      fl.forEach(k => { const o = el('option', { value: k }, (def.kind === '2d' ? FUNCS[k].nombre : F1D[k].nombre)); if (k === fid) o.selected = true; s.appendChild(o); });
      s.onchange = () => { fid = s.value; buildCtrls(); restart(); }; d.appendChild(s); ctr.appendChild(d);
    }
    def.params(F).forEach(p => {
      const d = el('div', { class: 'ctrl' }, `<label for="p-${key}-${p.k}">${p.l} <b>${fm(p.v, 4)}</b></label><input type="range" id="p-${key}-${p.k}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.v}">`);
      const inp = d.querySelector('input'), b = d.querySelector('b');
      inp.oninput = () => { b.textContent = fm(+inp.value, 4); }; inp.onchange = () => { P[p.k] = +inp.value; restart(); };
      ctr.appendChild(d);
    });
    const d = el('div', { class: 'ctrl' }, `<label for="sd-${key}">Semilla</label><div class="btns"><input type="number" id="sd-${key}" value="${seed}" min="1" max="99999" style="width:96px"><button type="button">Otra</button></div>`);
    const si = d.querySelector('input'); si.onchange = () => { seed = +si.value || 1; restart(); };
    d.querySelector('button').onclick = () => { seed = 1 + Math.floor(Math.random() * 9999); si.value = seed; restart(); };
    ctr.appendChild(d);
    if (def.click) ctr.appendChild(el('p', { class: 'hint' }, 'Clic en la gráfica: nuevo punto inicial.'));
  };
  buildCtrls(); restart();
  sec.querySelector('[data-a=step]').onclick = () => { run.stopPlay(); run.step(); };
  sec.querySelector('[data-a=iter]').onclick = () => { run.stopPlay(); run.iterate(); };
  playB.onclick = () => run.play();
  sec.querySelector('[data-a=reset]').onclick = () => { delete P.start; restart(); };
  const sp = sec.querySelector('#sp-' + key); sp.oninput = () => { run.speed = +sp.value; };
  plot.cv.addEventListener('click', e => {
    if (!def.click) return; const r = plot.cv.getBoundingClientRect(), w = plot.inv(e.clientX - r.left, e.clientY - r.top);
    P.start = def.kind === '1d' ? Math.min(getF().b, Math.max(getF().a, w[0])) : clampP(getF(), w); restart();
  });
  sec._redraw = () => run.render(); sec._stop = () => run.stopPlay();
}

/* ---------- comparación ---------- */
const CMP = ['aleatoria', 'colina', 'recocido', 'nelder', 'agreal', 'pso', 'abc', 'de', 'luciernagas'];
function buildCompare(sec) {
  sec.innerHTML = `<div class="eyebrow">¿Cómo comparar metaheurísticas?</div><h2>Comparación en 10 corridas</h2>
  <p style="max-width:75ch;color:#d6dbf7">Los métodos estocásticos dan un resultado distinto en cada corrida, así que se comparan con el mismo presupuesto de evaluaciones y varias semillas. La gráfica muestra la mediana del mejor valor encontrado contra el número de evaluaciones; la tabla resume el valor final.</p>
  <div class="ctrls" style="margin-bottom:12px"><div class="ctrl"><label for="cf">Función</label><select id="cf">${['rastrigin', 'ackley', 'himmelblau', 'griewank', 'schwefel', 'rosenbrock'].map(k => `<option value="${k}">${FUNCS[k].nombre}</option>`).join('')}</select></div>
   <div class="ctrl"><label for="cb">Evaluaciones por corrida <b id="cbv">2000</b></label><input type="range" id="cb" min="300" max="6000" step="100" value="2000"></div>
   <div class="ctrl" style="grid-column:1/-1"><label>Algoritmos</label><div class="chips">${CMP.map((k, i) => `<label><input type="checkbox" value="${k}" checked><span class="sw" style="background:${HUES[i]}"></span>${ALG[k].nombre.replace(/ \(.*\)/, '')}</label>`).join('')}</div></div>
   <div class="ctrl"><button class="pri" id="crun">Correr 10 corridas</button></div><div class="ctrl"><span class="hint" id="cstat">Listo para correr.</span></div></div>
  <div class="grid" style="grid-template-columns:minmax(0,7fr) minmax(0,5fr)"><canvas class="cmpc" id="ccv" aria-label="Curvas de convergencia"></canvas><div class="tw"><table class="big" id="ctab"><tr><th>Algoritmo</th><th>Mediana</th><th>Media ± d.e.</th><th>Mejor</th></tr></table></div></div>`;
  const cv = sec.querySelector('#ccv'), cb = sec.querySelector('#cb');
  cb.oninput = () => sec.querySelector('#cbv').textContent = cb.value;
  let results = [];
  const draw = () => {
    const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
    const g = cv.getContext('2d'), W = cv.width, H = cv.height, pl = 58 * d, pb = 34 * d, pt = 14 * d, pr = 14 * d;
    g.fillStyle = C.ink; g.fillRect(0, 0, W, H);
    if (!results.length) { g.fillStyle = C.mute; g.font = `${13 * d}px "IBM Plex Mono", monospace`; g.fillText('Pulsa «Correr 10 corridas».', pl, H / 2); return; }
    const all = results.flatMap(r => r.med).filter(v => v > 0); let lo = Math.max(1e-8, Math.min(...all)), hi = Math.max(...all);
    const L0 = Math.log10(lo), L1 = Math.log10(hi) + 1e-9, B = results[0].grid[results[0].grid.length - 1];
    const X = e => pl + (W - pl - pr) * e / B, Y = v => H - pb - (H - pb - pt) * (Math.log10(Math.max(v, lo)) - L0) / (L1 - L0);
    g.strokeStyle = 'rgba(245,243,255,.1)'; g.fillStyle = C.mute; g.font = `${11 * d}px "IBM Plex Mono", monospace`;
    for (let e = Math.ceil(L0); e <= Math.floor(L1); e++) { const y = Y(10 ** e); g.beginPath(); g.moveTo(pl, y); g.lineTo(W - pr, y); g.stroke(); g.fillText('10' + String(e).split('').map(c => SUPS[c] || c).join(''), 8 * d, y + 4 * d); }
    for (let i = 0; i <= 4; i++) { const e = B * i / 4, x = X(e); g.fillText(String(Math.round(e)), x - 10 * d, H - 12 * d); }
    g.fillText('evaluaciones', W - pr - 90 * d, H - 12 * d);
    results.forEach(r => { g.beginPath(); r.grid.forEach((e, i) => { const x = X(e), y = Y(r.med[i]); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.strokeStyle = r.c; g.lineWidth = 2.2 * d; g.stroke(); });
  };
  sec.querySelector('#crun').onclick = () => {
    const F = FUNCS[sec.querySelector('#cf').value], B = +cb.value, algs = [...sec.querySelectorAll('.chips input:checked')].map(i => i.value), st = sec.querySelector('#cstat');
    results = []; const grid = Array.from({ length: 61 }, (_, i) => Math.round(B * i / 60)); let ai = 0;
    const next = () => {
      if (ai >= algs.length) { st.textContent = `Listo: ${algs.length} algoritmos × 10 corridas × ${B} evaluaciones en ${F.nombre}.`; table(); draw(); return; }
      const k = algs[ai++], def = ALG[k]; st.textContent = `Corriendo ${def.nombre}…`;
      setTimeout(() => {
        const finals = [], curves = [];
        for (let s = 1; s <= 10; s++) {
          const P = defaultsOf(def, F); if (def.click) P.start = randIn(F, new Rng(s * 97 + 5));
          const tr = runBudget(def, F, P, s * 31 + 7, B); finals.push(tr.length ? tr[tr.length - 1][1] : NaN);
          let j = 0; curves.push(grid.map(e => { while (j + 1 < tr.length && tr[j + 1][0] <= e) j++; return tr.length ? tr[j][1] : NaN; }));
        }
        const med = grid.map((_, i) => { const v = curves.map(c => c[i]).filter(isFinite).sort((a, b) => a - b); return v.length ? v[Math.floor(v.length / 2)] : NaN; });
        results.push({ k, c: HUES[CMP.indexOf(k)], grid, med, finals }); draw(); next();
      }, 20);
    };
    next();
  };
  const table = () => {
    const rows = results.map(r => { const f = r.finals.filter(isFinite).sort((a, b) => a - b), m = f.reduce((a, b) => a + b, 0) / f.length, sd = Math.sqrt(f.reduce((a, b) => a + (b - m) ** 2, 0) / Math.max(1, f.length - 1)); return { r, med: f[Math.floor(f.length / 2)], m, sd, best: f[0] }; }).sort((a, b) => a.med - b.med);
